services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-factorypulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factorypulse}
      POSTGRES_DB: ${POSTGRES_DB:-factorypulse}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-factorypulse}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./services/platform-api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://factorypulse:factorypulse@postgres:5432/factorypulse}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [api]

  simulator:
    build: ./simulator
    environment:
      FACTORYPULSE_API_URL: http://api:8000
    depends_on: [api]
    profiles: ["tools"]

volumes:
  postgres_data:

